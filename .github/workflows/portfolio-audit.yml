name: Portfolio sale-readiness audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit accessible public repositories
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
        run: python scripts/audit_portfolio.py
      - name: Save latest report
        run: |
          git config user.name 'playbeat-portfolio-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet || (git commit -m "Update daily portfolio readiness report" && git push)
