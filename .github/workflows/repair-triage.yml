name: Repair candidate triage
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Portfolio sale-readiness audit"]
    types: [completed]
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/triage_repairs.py
      - name: Commit queue
        run: |
          git config user.name playbeat-portfolio-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/repair-queue.*
          git diff --cached --quiet || (git commit -m "Refresh repository repair triage queue" && git push)
