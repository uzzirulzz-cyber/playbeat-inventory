name: Sales catalog daily queue
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Portfolio sale-readiness audit"]
    types: [completed]
  schedule:
    - cron: '45 4 * * *'
permissions:
  contents: write
jobs:
  prepare-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare truthful reviewable listings
        run: python scripts/generate_sales_queue.py
      - name: Commit sales queue
        run: |
          git config user.name "playbeat-sales-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sales-queue.json reports/sales-queue.csv
          git diff --cached --quiet || (git commit -m "Refresh sales listing draft queue" && git push)
